<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Calculadora sencilla y moderna con historial." />
    <meta name="theme-color" content="#f3f4f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calculadora</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeos.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('calculadora.tema');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1 class="app-title">Calculadora</h1>
        <div class="app-header__actions">
          <button
            type="button"
            id="history-toggle"
            class="icon-button history-toggle"
            aria-label="Ver historial"
            aria-controls="history-panel"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v5h5" />
              <path d="M12 7v5l3 2" />
            </svg>
          </button>
          <button type="button" id="theme-toggle" class="icon-button" aria-label="Cambiar tema">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
        </div>
      </header>

      <main class="layout">
        <section class="calculator" aria-label="Calculadora">
          <div class="display" id="display" data-state="editing">
            <div class="display__expression" id="display-expression" aria-label="Operación"></div>
            <div class="display__result" id="display-result" aria-live="polite"></div>
          </div>
          <div class="keypad" id="keypad"></div>
        </section>

        <div class="history-backdrop" id="history-backdrop" hidden></div>

        <aside class="history" id="history-panel" aria-labelledby="history-title">
          <div class="history__header">
            <h2 class="history__title" id="history-title">Historial</h2>
            <div class="history__actions">
              <button type="button" id="history-clear" class="text-button">Borrar todo</button>
              <button type="button" id="history-close" class="icon-button history__close" aria-label="Cerrar historial">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
              </button>
            </div>
          </div>
          <p class="history__empty" id="history-empty">Aún no hay operaciones.</p>
          <ul class="history__list" id="history-list"></ul>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
